<!DOCTYPE html>
<html lang="en">
<head>
    <!--link to css file-->
    <link rel="stylesheet" href="styles.css">
    <meta charset="utf-8"/>
    <title>Countdown Timer</title>
</head>
<body class="all">
    <header>  
        <!--timer button in nav-->      
        <nav>
            <button id="timer" class="timer">T I M E R</button>
        </nav>
    </header>
    <main class="parent">
        <div id="container" class="hidden">
            <!--time display-->
            <p id="timeDisplay">01:00</p>
            <div class="buttons">
                <!--start, stop and pause button ids/classes-->
                <button id="start" class="start">Start Timer</button> |
                <button id="pause" class="pause">Pause Timer</button> |
                <button id="stop" class="stop">Stop Timer</button>
            </div>
        </div>
    </main>
    <!--link to js file-->
    <script src="script.js"></script>
</body>
</html>
